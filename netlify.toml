[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # SMTP_USER is the public contact address (contacto@proacademymx.com),
  # CONTACT_TO/CONTACT_FROM_NAME are also public contact data, and UPLOAD_DIR
  # is only documented as an example path; all are false positives for
  # Netlify's secrets scanner. Tell it not to fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_USER,UPLOAD_DIR,CONTACT_TO,CONTACT_FROM_NAME"

# Security headers applied to every response (previously in vercel.json /
# server.mjs; the Netlify adapter has no server to wrap).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://connect.facebook.net https://snap.licdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.clarity.ms https://px.ads.linkedin.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me"

# Hashed build assets are immutable, so cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# One canonical host: www permanently redirects to the apex domain (the origin
# the site is actually served from and the one used in canonicals/sitemap).
[[redirects]]
  from = "https://www.proacademymx.com/*"
  to = "https://proacademymx.com/:splat"
  status = 301
  force = true

# Do not add trailing-slash redirects for the static blog: Netlify's pretty
# URLs already normalize /blog to /blog/, and a rule for "/blog/" also matches
# "/blog" (causing a self-redirect loop). Canonical tags stay slash-free.
