backend:
  name: github
  repo: NewtonSupreme/Proacademy-astro
  branch: master
  base_url: https://www.proacademymx.com
  auth_endpoint: api/decap/auth

# Where uploaded images are stored in the repo, and the public URL prefix
# Astro serves them under (everything in public/ is served as-is from /).
media_folder: "public/images/blog"
public_folder: "/images/blog"

publish_mode: simple
locale: "es"

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Artículo"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} — {{pubDate}}"
    sortable_fields: ["pubDate", "title", "draft"]
    view_filters:
      - label: "Publicados"
        field: draft
        pattern: "false"
      - label: "Borradores"
        field: draft
        pattern: "true"
    view_groups:
      - label: "Categoría"
        field: category
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - label: "Descripción (SEO, ~155 caracteres)"
        name: "description"
        widget: "text"
      - label: "Categoría principal"
        name: "category"
        widget: "string"
        hint: "Nombre visible, ej. TOEFL, SAT, GRE. Debe coincidir con el primer elemento de \"Categorías\" abajo."
      - label: "Slug de la categoría principal"
        name: "categorySlug"
        widget: "string"
        hint: "Minúsculas, sin espacios/acentos, ej. toefl, sat, gre."
      - label: "Categorías"
        name: "categories"
        widget: "list"
        summary: "{{fields.name}}"
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "Slug", name: "slug", widget: "string" }
      - label: "Fecha de publicación"
        name: "pubDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "Fecha de actualización"
        name: "updatedDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: "Imagen destacada"
        name: "image"
        widget: "image"
        required: false
      - label: "Texto alternativo de la imagen"
        name: "imageAlt"
        widget: "string"
        required: false
      - label: "Ancho de la imagen (px)"
        name: "imageWidth"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Alto de la imagen (px)"
        name: "imageHeight"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Autor"
        name: "author"
        widget: "string"
        default: "Professional Academy"
      - label: "Tiempo de lectura (minutos)"
        name: "readingTime"
        widget: "number"
        value_type: "int"
        default: 5
      - label: "Borrador (no se publica hasta desmarcarlo)"
        name: "draft"
        widget: "boolean"
        default: true
      - { label: "Contenido", name: "body", widget: "markdown" }
